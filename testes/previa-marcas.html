<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../css/style.css"><style>body{padding:20px;background:#060504;color:#e3b341;font-family:sans-serif} .row{display:flex;gap:28px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.big{width:200px;height:150px;border:1px solid #2a2417;color:#e3b341}.small{border:1px dashed #2a2417;padding:6px;color:#e3b341}.art-accent{color:#e3b341}</style></head><body><div id="o"></div>
<script src="../js/art.js"></script>
<script>
const o=document.getElementById("o");
["joalheria","petshop","comercio","servicos","alimentacao","saude","outro"].forEach(id=>{const r=document.createElement("div");r.className="row";const l=document.createElement("b");l.textContent=id;l.style.width="90px";r.appendChild(l);const b=document.createElement("div");b.className="big";b.appendChild(buildSegmentArt(id));r.appendChild(b);const s=document.createElement("div");s.className="small";s.appendChild(buildSegmentMark(id,26));r.appendChild(s);const s2=document.createElement("div");s2.className="small";s2.appendChild(buildSegmentMark(id,60));r.appendChild(s2);o.appendChild(r);});
